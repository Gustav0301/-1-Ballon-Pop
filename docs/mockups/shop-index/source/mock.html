*{box-sizing:border-box;margin:0;padding:0}
body{background:#14101f;font-family:'Fredoka One',sans-serif;padding:40px;display:flex;gap:80px;align-items:flex-start}
.screen{width:1212px;position:relative;padding:6px}
/* stroked white text like the Figma layers */
.t{color:#fff;-webkit-text-stroke:var(--sw,8px) #000;paint-order:stroke fill;text-shadow:0 var(--sy,4px) 0 rgba(0,0,0,.28);line-height:1.1;white-space:nowrap}
.mono{font-family:'Montserrat';font-weight:800}
/* chunky block: black outline, darker lip at the bottom, gradient face with studs */
.block{position:absolute;background:var(--lip);outline:5px solid #000;}
.block>.face{position:absolute;left:0;top:0;right:0;bottom:var(--L,18px);background:linear-gradient(180deg,var(--top),var(--bot));box-shadow:inset 0 0 0 4px var(--edge);overflow:hidden}
.block>.face::after{content:"";position:absolute;inset:4px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30'><rect x='7' y='7' width='16' height='16' rx='3' fill='white' fill-opacity='.08'/><path d='M7.5 21V10a3 3 0 0 1 3-3H21' stroke='white' stroke-opacity='.42' stroke-width='2' fill='none'/><path d='M22.5 9v11a3 3 0 0 1-3 3H9' stroke='black' stroke-opacity='.22' stroke-width='2' fill='none'/></svg>");pointer-events:none}
.in{position:absolute;z-index:2}
.tag{display:inline-block;font-size:21px;padding:2px 12px 5px;border:3px solid #000;border-radius:8px;margin-right:8px;--sw:5px;--sy:2px}

.perm{background:#3fa9ff}.cos{background:#ff4fa3}.cons{background:#ff8a1f}.soon{background:#8d86a3}.new{background:#3fd46a}

.ph b{font-weight:normal;font-size:38px;--sw:6px}
.ph i{font-style:normal;font-size:19px;--sw:4px;white-space:normal;max-width:90%}
.buy{position:absolute;z-index:3;width:250px;height:84px;--L:8px}

.rbx{width:44px;height:46px;flex:none}
.sec{position:absolute;left:22px;display:flex;align-items:baseline;gap:22px}
.sec h2{font-weight:normal;font-size:58px;--sw:10px;--sy:5px}

.mt .nm{top:226px;font-size:34px}
.mt .sub{position:absolute;z-index:2;left:0;right:0;top:268px;text-align:center;font-size:20px;--sw:4px;--sy:2px;color:#ffe58a}
